<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Alex — English Coach</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap');
  * { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --p1: #6C63FF; --p2: #EEF0FF;
    --bg: #F8F9FF; --white: #fff;
    --text: #1A1A2E; --muted: #888; --border: #ECECF0;
    --radius: 16px; --radius-sm: 10px;
  }
  body { font-family: 'Nunito', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; max-width: 480px; margin: 0 auto; }
  .screen { display: none; min-height: 100vh; flex-direction: column; }
  .screen.active { display: flex; }

  /* ── SETUP SCREEN ── */
  #setup { padding: 32px 24px; align-items: center; justify-content: center; text-align: center; }
  .alex-bounce { font-size: 80px; animation: bounce 2s infinite; display: block; margin-bottom: 16px; }
  @keyframes bounce { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-10px)} }
  .setup-title { font-size: 32px; font-weight: 900; color: var(--text); }
  .setup-sub { font-size: 16px; color: var(--p1); font-weight: 700; margin-top: 6px; margin-bottom: 32px; }

  .setup-card { background: var(--white); border-radius: var(--radius); border: 2px solid var(--border); padding: 24px; width: 100%; margin-bottom: 16px; }
  .setup-label { font-size: 14px; font-weight: 800; color: var(--muted); margin-bottom: 12px; text-transform: uppercase; letter-spacing: .5px; }

  .name-input { width: 100%; border: 2px solid var(--border); border-radius: var(--radius-sm); padding: 14px 16px; font-size: 18px; font-family: 'Nunito', sans-serif; font-weight: 700; color: var(--text); outline: none; text-align: center; }
  .name-input:focus { border-color: var(--p1); }

  .age-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
  .age-btn { padding: 16px 8px; border: 2px solid var(--border); border-radius: var(--radius-sm); background: var(--white); font-family: 'Nunito', sans-serif; font-size: 20px; font-weight: 800; cursor: pointer; transition: all .15s; color: var(--text); }
  .age-btn:hover { border-color: var(--p1); background: var(--p2); }
  .age-btn.selected { border-color: var(--p1); background: var(--p1); color: #fff; transform: scale(1.05); }

  .avatar-row { display: flex; justify-content: center; gap: 10px; flex-wrap: wrap; }
  .av-btn { width: 52px; height: 52px; border-radius: 50%; border: 2px solid var(--border); background: var(--white); font-size: 28px; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: all .15s; }
  .av-btn.selected { border-color: var(--p1); background: var(--p2); transform: scale(1.15); }

  .api-box { background: #fff8e1; border: 2px solid #ffc107; border-radius: var(--radius-sm); padding: 14px 16px; width: 100%; margin-bottom: 16px; }
  .api-box strong { display: block; color: #856404; font-size: 13px; margin-bottom: 6px; }
  .api-box input { width: 100%; border: 1.5px solid #ffc107; border-radius: 8px; padding: 8px 12px; font-size: 13px; font-family: monospace; background: #fff; }

  .start-btn { width: 100%; background: var(--p1); color: #fff; border: none; border-radius: var(--radius-sm); padding: 18px; font-size: 18px; font-weight: 900; cursor: pointer; font-family: 'Nunito', sans-serif; transition: transform .1s, opacity .1s; margin-top: 8px; }
  .start-btn:hover { opacity: .92; transform: translateY(-1px); }
  .start-btn:disabled { opacity: .4; cursor: default; transform: none; }

  /* ── CHAT SCREEN ── */
  #chat { background: var(--bg); }

  .chat-header { background: var(--white); border-bottom: 1.5px solid var(--border); padding: 12px 16px; display: flex; align-items: center; gap: 12px; flex-shrink: 0; }
  .back-btn { font-size: 24px; cursor: pointer; color: var(--muted); }
  .alex-face { font-size: 40px; width: 52px; height: 52px; border-radius: 50%; display: flex; align-items: center; justify-content: center; border: 3px solid var(--p1); background: var(--p2); position: relative; }
  .mood-dot { position: absolute; bottom: -2px; right: -2px; font-size: 16px; }
  .header-info { flex: 1; }
  .header-name { font-size: 17px; font-weight: 900; }
  .header-level { font-size: 12px; color: var(--muted); font-weight: 700; }
  .streak-pill { padding: 5px 12px; border-radius: 20px; font-size: 13px; font-weight: 800; background: #fff3e0; color: #e65100; }

  .messages { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 12px; }

  .msg { max-width: 84%; display: flex; flex-direction: column; gap: 4px; }
  .msg.user { align-self: flex-end; align-items: flex-end; }
  .msg.alex { align-self: flex-start; align-items: flex-start; }
  .bubble { padding: 12px 16px; border-radius: 18px; font-size: 15px; line-height: 1.55; font-weight: 600; }
  .msg.user .bubble { background: var(--p1); color: #fff; border-bottom-right-radius: 4px; }
  .msg.alex .bubble { background: var(--white); border: 1.5px solid var(--border); border-bottom-left-radius: 4px; }
  .speak-btn { background: none; border: none; font-size: 15px; cursor: pointer; opacity: .5; padding: 2px 4px; }
  .speak-btn:hover { opacity: 1; }

  .feedback { background: var(--white); border: 2px solid #e8e8ff; border-radius: var(--radius); padding: 14px; animation: fadeUp .3s ease; }
  @keyframes fadeUp { from{opacity:0;transform:translateY(8px)} to{opacity:1;transform:translateY(0)} }
  .fb-stars { font-size: 22px; margin-bottom: 6px; }
  .fb-good { font-size: 14px; font-weight: 700; color: #27ae60; }
  .fb-fix { font-size: 13px; color: #e67e22; font-weight: 600; margin-top: 5px; }
  .fb-corrected { font-size: 14px; font-weight: 800; color: #2980b9; margin-top: 3px; }
  .fb-tip { font-size: 12px; color: var(--muted); background: var(--bg); padding: 5px 10px; border-radius: 8px; margin-top: 5px; }
  .fb-dismiss { background: none; border: 1.5px solid var(--border); border-radius: 8px; padding: 5px 14px; font-size: 12px; font-weight: 700; cursor: pointer; margin-top: 8px; font-family: 'Nunito', sans-serif; color: var(--muted); }

  .thinking { display: flex; gap: 5px; padding: 14px 18px; background: var(--white); border: 1.5px solid var(--border); border-radius: 18px; border-bottom-left-radius: 4px; width: fit-content; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); animation: pulse 1.2s infinite; }
  .dot:nth-child(2){animation-delay:.2s}.dot:nth-child(3){animation-delay:.4s}
  @keyframes pulse{0%,100%{opacity:.3;transform:scale(1)}50%{opacity:1;transform:scale(1.3)}}

  .topics-bar { padding: 10px 12px; border-top: 1.5px solid var(--border); background: var(--white); flex-shrink: 0; }
  .topics-label { font-size: 11px; color: var(--muted); font-weight: 700; margin-bottom: 8px; text-transform: uppercase; letter-spacing: .5px; }
  .topics-scroll { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 2px; }
  .topics-scroll::-webkit-scrollbar { display: none; }
  .topic-chip { padding: 7px 14px; border-radius: 20px; border: 2px solid var(--p1); font-size: 13px; font-weight: 700; cursor: pointer; white-space: nowrap; background: var(--white); font-family: 'Nunito', sans-serif; color: var(--p1); flex-shrink: 0; transition: background .15s; }
  .topic-chip:hover { background: var(--p2); }

  .input-area { padding: 10px 12px; border-top: 1.5px solid var(--border); background: var(--white); display: flex; align-items: flex-end; gap: 8px; flex-shrink: 0; }
  .msg-input { flex: 1; background: var(--bg); border: 1.5px solid var(--border); border-radius: 22px; padding: 10px 16px; font-size: 15px; font-family: 'Nunito', sans-serif; font-weight: 600; resize: none; max-height: 100px; outline: none; color: var(--text); }
  .msg-input:focus { border-color: var(--p1); }
  .send-btn { width: 44px; height: 44px; border-radius: 50%; border: none; background: var(--p1); color: #fff; font-size: 18px; cursor: pointer; flex-shrink: 0; transition: transform .1s; display: flex; align-items: center; justify-content: center; }
  .send-btn:active { transform: scale(.92); }
  .send-btn:disabled { opacity: .35; cursor: default; }
</style>
</head>
<body>

<!-- ══ SETUP ══ -->
<div id="setup" class="screen active">
  <span class="alex-bounce">🤖</span>
  <div class="setup-title">Hi! I'm Alex!</div>
  <div class="setup-sub">Your personal English coach 🌟</div>

  <div class="setup-card">
    <div class="setup-label">What's your name?</div>
    <input class="name-input" id="user-name" placeholder="Type your name..." maxlength="20"
      oninput="checkReady()" />
  </div>

  <div class="setup-card">
    <div class="setup-label">How old are you?</div>
    <div class="age-grid" id="age-grid">
      <!-- ages 8–16 -->
    </div>
  </div>

  <div class="setup-card">
    <div class="setup-label">Choose your avatar</div>
    <div class="avatar-row" id="avatar-row"></div>
  </div>

  <div class="api-box">
    <strong>🔑 Anthropic API Key (required)</strong>
    <input type="password" id="api-key" placeholder="sk-ant-..." oninput="checkReady()" />
    <div style="font-size:11px;color:#856404;margin-top:5px">Get yours at console.anthropic.com → API Keys</div>
  </div>

  <button class="start-btn" id="start-btn" onclick="startChat()" disabled>
    Let's start! 🚀
  </button>
</div>

<!-- ══ CHAT ══ -->
<div id="chat" class="screen">
  <div class="chat-header">
    <span class="back-btn" onclick="goBack()">←</span>
    <div class="alex-face">
      🤖<span class="mood-dot" id="mood-dot">😊</span>
    </div>
    <div class="header-info">
      <div class="header-name" id="header-name">Alex</div>
      <div class="header-level" id="header-level">English Coach</div>
    </div>
    <div class="streak-pill" id="streak-pill" style="display:none"></div>
  </div>

  <div class="messages" id="messages"></div>

  <div class="topics-bar" id="topics-bar">
    <div class="topics-label">Pick a topic to start</div>
    <div class="topics-scroll">
      <button class="topic-chip" onclick="pickTopic('school life')">🏫 School</button>
      <button class="topic-chip" onclick="pickTopic('video games and hobbies')">🎮 Games</button>
      <button class="topic-chip" onclick="pickTopic('food and eating')">🍕 Food</button>
      <button class="topic-chip" onclick="pickTopic('movies and TV shows')">🎬 Movies</button>
      <button class="topic-chip" onclick="pickTopic('travel and places')">✈️ Travel</button>
      <button class="topic-chip" onclick="pickTopic('animals and pets')">🐶 Animals</button>
    </div>
  </div>

  <div class="input-area">
    <textarea class="msg-input" id="msg-input" placeholder="Talk to Alex in English..." rows="1"
      onkeydown="if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();send()}"
      oninput="autoResize(this);updateBtn()"></textarea>
    <button class="send-btn" id="send-btn" onclick="send()" disabled>➤</button>
  </div>
</div>

<script>
const AVATARS = ['👦','👧','🧒','🧑','🐶','🦊','🐱','🦁','🐸','🚀','⭐','🌈'];
const AGES = [8,9,10,11,12,13,14,15,16];

let userName = '', userAge = 0, userAvatar = '', apiKey = '';
let messages = [], isThinking = false, streak = 0;

// Build age grid
document.getElementById('age-grid').innerHTML = AGES.map(a =>
  `<button class="age-btn" onclick="selectAge(${a},this)">${a}</button>`
).join('');

// Build avatar row
document.getElementById('avatar-row').innerHTML = AVATARS.map((av,i) =>
  `<button class="av-btn ${i===0?'selected':''}" onclick="selectAvatar('${av}',this)">${av}</button>`
).join('');
userAvatar = AVATARS[0];

function selectAge(age, el) {
  userAge = age;
  document.querySelectorAll('.age-btn').forEach(b => b.classList.remove('selected'));
  el.classList.add('selected');
  checkReady();
}

function selectAvatar(av, el) {
  userAvatar = av;
  document.querySelectorAll('.av-btn').forEach(b => b.classList.remove('selected'));
  el.classList.add('selected');
}

function checkReady() {
  userName = document.getElementById('user-name').value.trim();
  apiKey = document.getElementById('api-key').value.trim();
  document.getElementById('start-btn').disabled = !(userName && userAge && apiKey.startsWith('sk-ant-'));
}

function startChat() {
  document.getElementById('setup').classList.remove('active');
  document.getElementById('chat').classList.add('active');

  const level = userAge <= 11 ? 'Beginner' : 'Intermediate';
  document.getElementById('header-name').textContent = `Alex & ${userName}`;
  document.getElementById('header-level').textContent = `${userAge <= 11 ? '⭐ Beginner' : '🚀 Intermediate'} · English Coach`;

  const greeting = userAge <= 11
    ? `Hi ${userName}! I'm Alex! 🎉 I'm SO happy to meet you! What's your favorite thing to do after school?`
    : `Hey ${userName}! I'm Alex, your English coach! Really glad you're here. So, what's been going on with you lately?`;

  addMsg('alex', greeting);
  setMood('excited');
  speak(greeting);
}

function goBack() {
  document.getElementById('chat').classList.remove('active');
  document.getElementById('setup').classList.add('active');
  document.getElementById('messages').innerHTML = '';
  messages = [];
  streak = 0;
}

function pickTopic(topic) {
  document.getElementById('msg-input').value = `Let's talk about ${topic}!`;
  document.getElementById('topics-bar').style.display = 'none';
  updateBtn();
  document.getElementById('msg-input').focus();
}

function addMsg(role, content, feedback) {
  const id = Date.now() + Math.random();
  messages.push({ id, role, content, feedback });
  renderMessages();
  return id;
}

function renderMessages() {
  const wrap = document.getElementById('messages');
  let html = messages.map(m => `
    <div class="msg ${m.role === 'user' ? 'user' : 'alex'}">
      <div class="bubble">${esc(m.content)}</div>
      ${m.role === 'alex' ? `<button class="speak-btn" onclick="speak('${escAttr(m.content)}')">🔊</button>` : ''}
      ${m.feedback && !m.fbDismissed ? renderFeedback(m) : ''}
    </div>`).join('');

  if (isThinking) html += `<div class="msg alex"><div class="thinking"><div class="dot"></div><div class="dot"></div><div class="dot"></div></div></div>`;

  wrap.innerHTML = html;
  setTimeout(() => wrap.scrollTop = wrap.scrollHeight, 50);
}

function renderFeedback(m) {
  const fb = m.feedback;
  const stars = '⭐'.repeat(fb.stars) + '☆'.repeat(3 - fb.stars);
  return `<div class="feedback">
    <div class="fb-stars">${stars}</div>
    <div class="fb-good">✅ ${esc(fb.whatWasGood)}</div>
    ${fb.hasCorrection ? `
      <div class="fb-fix">🔧 ${esc(fb.correction)}</div>
      <div class="fb-corrected">Try: "${esc(fb.correctedSentence)}"</div>
      ${fb.tip ? `<div class="fb-tip">💡 ${esc(fb.tip)}</div>` : ''}` : ''}
    <button class="fb-dismiss" onclick="dismiss(${m.id})">Got it 👍</button>
  </div>`;
}

function dismiss(id) {
  const m = messages.find(x => x.id === id);
  if (m) m.fbDismissed = true;
  renderMessages();
}

async function send() {
  const input = document.getElementById('msg-input');
  const text = input.value.trim();
  if (!text || isThinking) return;
  input.value = ''; input.style.height = 'auto'; updateBtn();
  document.getElementById('topics-bar').style.display = 'none';

  addMsg('user', text);
  isThinking = true; setMood('thinking'); renderMessages();

  try {
    const history = messages.slice(-12).map(m => ({
      role: m.role === 'alex' ? 'assistant' : 'user',
      content: m.content
    }));

    const result = await callAlex(history);
    isThinking = false;
    setMood(result.alexMood || 'happy');
    messages.push({ id: Date.now()+Math.random(), role:'alex', content: result.response, feedback: result.feedback });
    renderMessages();
    speak(result.response);

    // streak
    if (!result.feedback?.hasCorrection) streak++;
    else streak = 0;
    const pill = document.getElementById('streak-pill');
    if (streak >= 3) { pill.style.display='block'; pill.textContent=`🔥 ${streak} in a row!`; }
    else pill.style.display='none';

  } catch(err) {
    isThinking = false; setMood('encouraging');
    messages.push({ id: Date.now(), role:'alex', content:`Oops! Something went wrong. Check your API key and try again! 😅 (${err.message})` });
    renderMessages();
  }
}

async function callAlex(history) {
  const level = userAge <= 11 ? 'beginner' : 'intermediate';
  const personality = level === 'beginner'
    ? 'Be SUPER playful and silly! Use simple words, max 8 words per sentence. A1-A2 vocabulary only. Use lots of exclamation marks!'
    : 'Be cool and relatable, like a fun older cousin. Casual but encouraging. B1-B2 vocabulary.';

  const system = `You are Alex, an enthusiastic English coach for Hebrew-speaking kids.
You are helping ${userName}, age ${userAge}, level: ${level}.

PERSONALITY: ${personality}

RULES:
1. ALWAYS mention something positive FIRST.
2. Correct gently: "Almost! Try: [corrected sentence]" — NEVER say "wrong" or "mistake".
3. Keep response to 2-3 sentences MAX.
4. End with a question to keep them talking!
5. React with big enthusiasm when they do well!

Watch for Hebrew-speaker mistakes: missing articles (a/the), verb tense confusion, word order in questions, missing auxiliaries (I don't know, not I not know), preposition errors.

RETURN ONLY this JSON (no text before or after):
{
  "response": "Your 2-3 sentence reply",
  "alexMood": "happy",
  "feedback": {
    "stars": 3,
    "whatWasGood": "Specific praise",
    "hasCorrection": false,
    "correction": "",
    "correctedSentence": "",
    "tip": ""
  }
}
alexMood options: happy | excited | thinking | encouraging | celebrating | proud
Stars: 3=perfect, 2=minor error, 1=notable errors but good effort`;

  const res = await fetch('https://api.anthropic.com/v1/messages', {
    method: 'POST',
    headers: {
      'x-api-key': apiKey,
      'anthropic-version': '2023-06-01',
      'content-type': 'application/json',
      'anthropic-dangerous-direct-browser-access': 'true'
    },
    body: JSON.stringify({
      model: 'claude-sonnet-4-6',
      max_tokens: 400,
      system,
      messages: history
    })
  });

  if (!res.ok) throw new Error(`API ${res.status}: ${await res.text()}`);
  const data = await res.json();
  const raw = data.content[0].text.trim();
  try {
    const match = raw.match(/\{[\s\S]*\}/);
    return JSON.parse(match ? match[0] : raw);
  } catch {
    return { response: raw, alexMood:'happy', feedback:{ stars:2, whatWasGood:'Great job!', hasCorrection:false, correction:'', correctedSentence:'', tip:'' }};
  }
}

function setMood(mood) {
  const map = { happy:'😊', excited:'🤩', thinking:'🤔', encouraging:'😄', celebrating:'🎉', proud:'😎' };
  document.getElementById('mood-dot').textContent = map[mood] || '😊';
}

function speak(text) {
  if ('speechSynthesis' in window) {
    window.speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    u.lang = 'en-US'; u.rate = 0.85;
    window.speechSynthesis.speak(u);
  }
}

function autoResize(el) { el.style.height='auto'; el.style.height=Math.min(el.scrollHeight,100)+'px'; }
function updateBtn() {
  const v = document.getElementById('msg-input').value.trim();
  const btn = document.getElementById('send-btn');
  btn.disabled = !v || isThinking;
  btn.style.opacity = (v && !isThinking) ? '1' : '0.35';
}
function esc(s) { return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function escAttr(s) { return String(s||'').replace(/'/g,"\\'").replace(/\n/g,' ').substring(0,200); }
</script>
</body>
</html>
